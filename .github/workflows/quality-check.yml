name: Quality Check
# Run repository quality checks for pushes, pull requests, and manual requests.
# Push·Pull Request·수동 요청에 대해 저장소 품질 검사를 실행합니다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: Documentation and security checks
    # Use a hosted GitHub runner so the checks do not require local tools.
    # 로컬 도구 없이 검사하도록 GitHub 호스팅 실행기를 사용합니다.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whitespace errors
        # Check tracked text changes for whitespace errors.
        # 추적된 텍스트 변경의 공백 오류를 확인합니다.
        run: git diff-tree --check --no-commit-id -r "${{ github.sha }}"

      - name: Check required documentation
        # Stop the workflow when required project documents are missing.
        # 필수 프로젝트 문서가 없으면 workflow를 중단합니다.
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f CLINE.md
          test -f CONVERSATION_LOG.md
          test -f docs/office/change-report.md
          test -f docs/specs/current-weather.md

      - name: Scan for private paths and common secrets
        # Fail when tracked files contain local paths or common secret markers.
        # 추적 파일에 개인 경로나 일반적인 시크릿 표시가 있으면 실패합니다.
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE \
            '/Users/|/private/tmp|/var/folders|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+' \
            -- ':!.github/workflows/quality-check.yml'; then
            echo "Private path or secret-like value found."
            exit 1
          fi

      - name: Validate workflow file
        # Confirm that the workflow file is present and readable.
        # workflow 파일이 존재하고 읽을 수 있는지 확인합니다.
        run: test -s .github/workflows/quality-check.yml

  application-check:
    # Verify the application using the same commands documented for local work.
    # 로컬 작업 문서와 같은 명령으로 애플리케이션을 검증합니다.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python and test HTTP contracts
        working-directory: backend
        run: |
          ruff check --isolated .
          python -m pytest -q
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check types, component behavior, and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Test the real browser pipeline
        # Playwright starts the API and frontend servers, then closes them.
        # Playwright가 API와 Frontend 서버를 시작하고 검증 후 종료합니다.
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
