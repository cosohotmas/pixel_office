name: Particle-1 trusted review implementation

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      pull-request-number:
        required: true
        type: string
      base-sha:
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit AI review comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: particle-ai/particle-1:free,recursive/flint-v1.0:free,dots-studio/dots-3-note-preview:free,nvidia/nemotron-3.5-lightning:free,google/gemma-4-26b-a4b-it:free,google/gemma-4-31b-it:free,openrouter/free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL_NAME: '#pixel_office'
        run: python scripts/particle_review.py
