name: Particle-1 trusted review implementation

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      pull-request-number:
        required: true
        type: string
      base-sha:
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit AI review comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: particle-ai/particle-1:free
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/particle_review.py
